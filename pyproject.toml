[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "cell-type-annotation"
version = "0.4.1"
description = "Method routing, evidence checks, label hierarchies and reports for evidence-driven cell-type annotation."
readme = "README.md"
license = "MIT"
authors = [ { name = "quadbio" } ]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [ "anndata>=0.12", "matplotlib>=3.8", "numpy>=2", "pandas>=2", "scipy" ]
urls.Source = "https://github.com/quadbio/cell-type-annotation"

[dependency-groups]
dev = [ "pre-commit", "pytest" ]

[tool.hatch]
build.targets.wheel.packages = [ "src/cell_type_annotation" ]

[tool.ruff]
line-length = 120
src = [ "src", "tests" ]
lint.select = [ "B", "C4", "D", "E", "F", "I", "UP" ]
lint.ignore = [
  "D100",
  "D104",
  "D105",
  "D107",
  "D203",
  "D213",
  "D401", # docstrings may open with a noun phrase
]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = [ "--import-mode=importlib" ]
