# Pre-commit hooks for the cell-type-annotation skill repo.
#
# Adapted from the scverse cookiecutter template
# (https://github.com/scverse/cookiecutter-scverse) for this repo's layout: the Python
# toolkit lives under `skills/cell-type-annotation/`, not at the repo root, and is managed
# with pixi. ruff auto-discovers the `[tool.ruff]` config in
# `skills/cell-type-annotation/pyproject.toml` for every file beneath it, so the ruff hooks
# need no explicit `--config`. The pyproject-fmt hook is scoped to that nested file.
#
# Run locally with `pixi run pre-commit` (from skills/cell-type-annotation) or
# `pre-commit run --all-files` from the repo root. CI runs the same hooks (.github/workflows/lint.yaml).
ci:
  # If you later enable the pre-commit.ci GitHub App on this repo (scverse's choice), it
  # will auto-fix PRs from this config and you can drop .github/workflows/lint.yaml.
  autofix_prs: true
  autofix_commit_msg: "style: pre-commit auto-fixes"
  autoupdate_schedule: monthly
  autoupdate_commit_msg: "chore: pre-commit autoupdate"

# pixi.lock is generated by pixi; don't let the whitespace/EOF hooks fight its writer.
exclude: ^skills/cell-type-annotation/pixi\.lock$

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.19
    hooks:
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.25.0
    hooks:
      - id: pyproject-fmt
        files: ^skills/cell-type-annotation/pyproject\.toml$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-ast
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
      - id: check-case-conflict
      - id: check-merge-conflict
