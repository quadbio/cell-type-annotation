[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "cta"
version = "0.1.0"
description = "Evidence-driven, compute-environment-aware cell-type annotation skill toolkit."
readme = "SKILL.md"
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# Dependencies are managed in pixi.toml (the single source of truth), not here — this
# package is always installed editable into a pixi environment. Keeping this empty avoids
# two competing dependency lists.
dependencies = []
scripts.cta = "cta.cli:main"

[tool.hatch]
build.targets.wheel.packages = [ "src/cta" ]

[tool.ruff]
line-length = 100
src = [ "src", "tests" ]
lint.select = [ "B", "C4", "E", "F", "I", "UP" ]
lint.ignore = [
  "B008", # function calls in argument defaults (fine for immutables)
  "E501", # long lines (docstrings/comments); the formatter handles code
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
# Exclude the live-network Census test from the default run (it hits CELLxGENE Census over
# the network). Opt in with `pixi run test-census` / `pytest -m census`.
ini_options.addopts = [ "--import-mode=importlib", "-m", "not census" ]
ini_options.markers = [ "census: live CELLxGENE Census integration test (network; opt-in)" ]
