[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "cta"
version = "0.1.0"
description = "Evidence-driven, compute-environment-aware cell-type annotation skill toolkit."
readme = "SKILL.md"
license = { text = "MIT" }
requires-python = ">=3.12"
# Dependencies are managed in pixi.toml (the single source of truth), not here — this
# package is always installed editable into a pixi environment. Keeping this empty avoids
# two competing dependency lists.
dependencies = []

[project.scripts]
cta = "cta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cta"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = [
  "E501", # long lines (docstrings/comments); the formatter handles code
  "B008", # function calls in argument defaults (fine for immutables)
]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
