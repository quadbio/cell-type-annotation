[workspace]
name = "cell-type-annotation"
version = "0.1.0"
description = "Evidence-driven, compute-environment-aware cell-type annotation skill."
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# Two environments (see reference/compute_environments.md):
#   default  CPU / Apple-Silicon core — everything the local_cpu profile needs. Deliberately
#            torch-free (lean, and avoids the macOS OpenMP clash), so the reference-model
#            tools are not available here.
#   gpu      adds the reference-model stack (scvi-tools: scANVI/scArches) + the CUDA-only
#            GPU k-NN libs (cuML/cuDF) + the optional large-memory foundation model
#            (scimilarity), Linux + NVIDIA only. Build it WHERE the GPU is:
#               pixi install -e gpu        # on a GPU node / host
#            On a scheduler login node, build `default` there and `gpu` inside a GPU job,
#            pointing the env at shared scratch (see [activation] / detached-environments).

[tasks]
# `pixi run cta <command> …` works directly; this is a convenience for the common probe.
detect-env = "cta detect-env"
test = "python -m pytest"
# Opt-in: the live CELLxGENE Census integration test (needs network).
test-census = "python -m pytest -m census"
# Lint / format. These mirror exactly what the root `.pre-commit-config.yaml` and CI run, so
# `pixi run lint` locally and the hooks/CI always agree. `lint` is check-only (the CI gate);
# `lint-fix` applies safe autofixes; `format` rewrites style. (ruff config in pyproject.toml.)
lint = { cmd = "ruff check . && ruff format --check ." }
lint-fix = "ruff check --fix ."
format = "ruff format ."
# Run every pre-commit hook over the whole tree (the same hooks CI enforces). `cwd` points
# at the repo root, where `.pre-commit-config.yaml` and the `.git` dir live.
pre-commit = { cmd = "pre-commit run --all-files", cwd = "../.." }

[dependencies]
# conda-forge for the interpreter, numpy (numba ABI), and faiss (the pip faiss wheels are
# build-/ABI-fragile — conda-forge's are reliable).
python = "3.12.*"
numpy = ">=2"
faiss-cpu = "*"
pytest = "*"
# Dev tooling. ruff is pinned-ish so local `pixi run lint` matches the versions in
# `.pre-commit-config.yaml` / CI; bump both together. (ruff config in pyproject.toml.)
ruff = ">=0.15"
pre-commit = "*"

[pypi-dependencies]
# The skill's own package (the `cta` CLI), installed editable.
cta = { path = ".", editable = true }
typer = "*"  # the CLI framework (grouped subcommands, typed options, lazy command bodies)

# scVerse marker/annotation stack.
scanpy = ">=1.10"
anndata = ">=0.10"
# pandas + scipy are used directly across the package (not just via scanpy) — declare them
# explicitly so a future scanpy that loosens them can't silently break us.
pandas = "*"
scipy = "*"
decoupler = ">=2.0"
celltypist = "*"
cellmapper = "*"
pynndescent = "*"
pyucell = "*"
scikit-misc = "*"
igraph = ">=0.11"
leidenalg = "*"

# Reporting.
matplotlib = "*"
seaborn = "*"
jinja2 = "*"
markdown = "*"

# NOTE: scvi-tools (scANVI/scArches) is intentionally NOT here. It pulls torch, whose
# bundled OpenMP clashes with conda's on macOS (OMP Error #15, a native abort the guarded
# imports can't catch), and the CPU default is meant to stay lean. It lives in the `gpu`
# feature below. To use the scANVI option locally on a Mac (MPS, slow), add scvi-tools to a
# separate env yourself — it is a GPU-tier tool by design (see reference/tool_registry.md).

# Additional cross-checks + condition-DE (Job B).
singler = "*"
celldex = "*"
pertpy = "*"
pydeseq2 = "*"
cellxgene-census = "*"

# --- GPU env: CUDA-only, Linux. cuML is what CellMapper's `rapids` k-NN backend needs
#     (validated on an RTX 4090); resolved from the NVIDIA index. ----------------------
[feature.gpu.pypi-options]
extra-index-urls = ["https://pypi.nvidia.com"]

# scimilarity pulls hnswlib, but its PyPI wheel is the problem: the 0.8.0 cp312 wheel is built
# with AVX-512 and SIGILLs `cta crosscheck scimilarity` when SCimilarity loads its prebuilt
# hnswlib kNN index on AVX2-only CPUs (verified crashing on Euler's AMD EPYC 7763 / Intel Xeon
# E3-1284L v4 — neither has AVX-512). The fix is to source hnswlib from conda-forge instead:
# conda-forge builds it portably (baseline microarch, no `-march=native`), so the same 0.8.0
# runs on any CPU (verified: the conda-forge .so has zero AVX-512/AVX2 ops and the full
# Index/load_index/knn_query path runs clean on an AVX2 node). Declaring it as a conda dep lets
# the conda binary satisfy scimilarity's PyPI `hnswlib>=0.8.0`, so uv never pulls the bad wheel
# — no override, no source build, no build-host `-march=native` fragility.
[feature.gpu.target.linux-64.dependencies]
hnswlib = ">=0.8"
# rapids-singlecell's compiled DE kernels (rapids_singlecell._cuda._aggr_cuda, used by the GPU
# `rank_genes_groups`) are built against CUDA 13 and link `libcudart.so.13`, but the rest of the
# GPU stack is CUDA 12 (cuml-cu12 / cupy-cuda12x / torch-cu12, which load libcudart.so.12). Without
# a CUDA-13 runtime present the kernel .so fails to load, rapids-singlecell sets it to None, and the
# GPU DE path silently falls back to scanpy (verified on Euler). Ship the CUDA-13 cudart runtime from
# conda-forge so libcudart.so.13 lands in $ENV/lib alongside .so.12 — the two majors coexist (the
# driver supports both) and the kernel loads. This is the actual enabler of issue #38's GPU path.
cuda-cudart = "13.*"

# Put the env's own lib dir on the dynamic-loader path for the gpu env so the CUDA-13 DE kernel
# above finds `libcudart.so.13` in $ENV/lib. pixi/`pixi run` does NOT add `$CONDA_PREFIX/lib` to
# LD_LIBRARY_PATH by default, so without this the kernel .so can't resolve libcudart.so.13 and the
# GPU DE path silently falls back to scanpy. Scoped to the gpu environment only; the CPU `default`
# env never sets this.
[feature.gpu.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"

[feature.gpu.target.linux-64.pypi-dependencies]
# Reference-model option (scANVI/scArches + scvi-hub). torch+OpenMP coexist fine with the
# conda stack on Linux (validated on an RTX 4090); on a GPU it actually uses CUDA.
scvi-tools = "*"
# CellMapper's `rapids` GPU k-NN backend calls cuML directly (validated on an RTX 4090).
cuml-cu12 = "*"
cudf-cu12 = "*"
# GPU marker DE: `cta markers compute` routes `rank_genes_groups` to rapids-singlecell on a GPU
# profile (atlas-scale ranking in seconds vs ~minutes on scanpy/CPU). Drop-in — same wilcoxon
# method, same `uns['rank_genes_groups']` output the CPU path writes; scanpy stays the CPU default.
# The `rapids-cu12` extra pulls the FULL RAPIDS stack it imports at load (cudf/cuml/cugraph/cuvs);
# the bare cuml-cu12/cudf-cu12 above (for CellMapper's kNN) are not enough — verified on Euler that
# `import rapids_singlecell` needs cuvs too.
rapids-singlecell = { version = "*", extras = ["rapids-cu12"] }
# rapids-singlecell 0.15.2 also imports `dask.array` at module load (rapids_singlecell/_compat.py)
# but only declares `dask` under its `doc`/`test` extras, not core — so the import ALSO needs dask
# present. Pull it in explicitly so the GPU DE path loads instead of silently falling back to scanpy.
dask = "*"
# Optional large-memory zero-shot annotator (additional cross-check only). Its hnswlib dep is
# pinned to the portable conda-forge build above (see comment) to avoid the AVX-512 wheel SIGILL.
scimilarity = "*"

# Needed by scvi.hub for `cta reference map-scarches --hf-repo` (pull a shipped scvi-tools
# model from the HuggingFace hub). Caps the gpu env's typer to <0.26 (hub dep); default env
# is unaffected.
[feature.gpu.pypi-dependencies]
huggingface-hub = ">=1.20.1, <2"

[environments]
gpu = ["gpu"]
